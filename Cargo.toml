[package]
name = "bagpipe"
version = "0.1.0"
edition = "2024"
description = "Record, compress with zstd, summarize and upload ROS 2 bags directly to Discord."
license = "MIT OR Apache-2.0"

[[bin]]
name = "bagpipe"
path = "src/main.rs"

[[bin]]
name = "bp"
path = "src/main.rs"

[[bin]]
name = "rosbag-pipe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
chrono = "0.4"
tar = "0.4"
zstd = "0.13"
dirs = "5.0"
indicatif = "0.17"
colored = "2.1"
tempfile = "3.10"
human_bytes = "0.4"
ctrlc = "3.4"

