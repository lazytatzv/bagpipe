[package]
name = "bagpipe-ros"
version = "0.1.0"
edition = "2024"
description = "Fast CLI tool to record, zstd-compress, and ship ROS 2 bags via rsync and Discord."
license = "MIT OR Apache-2.0"
repository = "https://github.com/lazytatzv/bagpipe"
homepage = "https://github.com/lazytatzv/bagpipe"
readme = "README.md"
keywords = ["ros2", "rosbag", "robotics", "zstd", "discord"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "bagpipe"
path = "src/main.rs"

[[bin]]
name = "bp"
path = "src/main.rs"

[[bin]]
name = "rosbag-pipe"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["multipart", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
anyhow = "1.0"
chrono = "0.4"
tar = "0.4"
zstd = { version = "0.13", features = ["zstdmt"] }
dirs = "5.0"
indicatif = "0.17"
colored = "2.1"
tempfile = "3.10"
human_bytes = "0.4"
ctrlc = "3.4"
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

